name: Android Release

# Build a signed prod release APK, smoke-test it on an emulator, and publish
# it to Cloudflare R2 (mt-android-releases) for sideload distribution. Fires
# on a version tag, or manually via the Actions tab.
#
# Three jobs (SB-353): build → smoke → publish. The Maestro launch smoke runs
# against the exact signed APK that would ship; a red smoke blocks the R2
# publish entirely, so a launch-crashing build is never force-fed to phones
# by the force-upgrade mechanism.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed prod release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # versionCode = run number so each build installs over the previous one.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleProdRelease

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: missingtable-prod-release
          path: app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: missingtable-prod-release
          path: apk

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run launch smoke on the signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-prod-release.apk
            maestro test .maestro/01-launch-prod.yaml

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: missingtable-prod-release
          path: apk

      - name: Publish APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          apk="apk/app-prod-release.apk"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ct="application/vnd.android.package-archive"
          # Min supported version = the newest build BEFORE this release. With
          # a keep-2 history (SB-327) users may lag at most one release; the
          # app hard-blocks anything older (SB-328). First release ever: min =
          # this build.
          prev=$(aws s3 ls "s3://mt-android-releases/builds/" --endpoint-url "$endpoint" \
            | awk '{print $4}' | sed 's/\.apk$//' | sort -n | tail -1)
          min="${prev:-${{ github.run_number }}}"
          echo "minversioncode=$min"
          # Versioned history + stable "latest" key the web-UI button points at.
          # versioncode metadata backs the in-app update check (SB-322): the
          # backend reads it via head_object and the app compares it to its own.
          aws s3 cp "$apk" "s3://mt-android-releases/builds/${{ github.run_number }}.apk" \
            --endpoint-url "$endpoint" --content-type "$ct" \
            --metadata "versioncode=${{ github.run_number }},minversioncode=$min"
          aws s3 cp "$apk" "s3://mt-android-releases/latest/missingtable.apk" \
            --endpoint-url "$endpoint" --content-type "$ct" \
            --metadata "versioncode=${{ github.run_number }},minversioncode=$min"
          # The bucket is private (MT is invite-only) and the r2.dev managed
          # domain is disabled in Terraform, so there is no public link to
          # print here. Phones install via an authenticated presigned URL:
          # missingtable.com -> footer -> GET /api/android/apk-url.
          echo "Published build ${{ github.run_number }} to s3://mt-android-releases/latest/missingtable.apk"
          echo "Install path: log in at missingtable.com -> footer 'Install the Android app'"

          # Prune build history — keep only the newest 2 (SB-327). latest/ is
          # a stable overwrite key and is never touched here.
          aws s3 ls "s3://mt-android-releases/builds/" --endpoint-url "$endpoint" \
            | awk '{print $4}' | sed 's/\.apk$//' | sort -n | head -n -2 \
            | while read -r n; do
                [ -n "$n" ] || continue
                echo "Pruning old build $n.apk"
                aws s3 rm "s3://mt-android-releases/builds/$n.apk" --endpoint-url "$endpoint"
              done
